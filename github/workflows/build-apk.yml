name: Build Math Lab APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json || true
          npx cap init "Wavelord Math Lab" com.wavelord.mathlab --web-dir=www || true
          if [ ! -d android ]; then npx cap add android || true; fi
          npx cap sync android
          DEST=android/app/src/main/java/com/wavelord/mathlab
          mkdir -p $DEST
          if [ -d overlay ]; then
            rm -f $DEST/*.java
            cp overlay/*.java $DEST/
            sed -i 's/^package .*/package com.wavelord.mathlab;/' $DEST/*.java
          fi
          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          mkdir -p android/app/src/main/assets/public
          cp index.html android/app/src/main/assets/public/index.html
          cp manifest.json android/app/src/main/assets/public/manifest.json || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: math-lab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
